version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: user-quota-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: user_quota_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - user-quota-network

volumes:
  mysql_data:

networks:
  user-quota-network:
