# ===============================
# = DEVELOPMENT PROFILE
# ===============================

# Database configurations for development environment
spring.datasource.url=jdbc:mysql://localhost:3309/user_quota_db
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate and JPA settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Custom log settings for development environment
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.userquotaservice=DEBUG

# Enable H2 console access (if using H2)
spring.h2.console.enabled=true

# Database timing settings for query testing
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ===================================
# = API QUOTA SETTINGS FOR DEVELOPMENT
# ===================================

# Settings for resource type one
app.quota.resource-one.threshold=5
app.quota.resource-one.name=QuotaResourceOne
app.quota.resource-one.enabled=true

# Settings for resource type two
app.quota.resource-two.threshold=3
app.quota.resource-two.name=QuotaResourceTwo
app.quota.resource-two.enabled=true

