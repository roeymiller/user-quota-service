spring.application.name=user-quota-service

# Port
server.port=8080

# API Quota Configuration - Default Settings
app.quota.resource-one.threshold=5
app.quota.resource-one.name=QuotaResourceOne
app.quota.resource-one.enabled=true

app.quota.resource-two.threshold=3
app.quota.resource-two.name=QuotaResourceTwo
app.quota.resource-two.enabled=true

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/user_quota_db?createDatabaseIfNotExist=true
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Force SQL initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded
spring.sql.init.schema-locations=classpath:schema.sql

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.example.userquotaservice=DEBUG
logging.level.org.hibernate=INFO

# Database timing configuration
database.mysql.start-time=00:00
database.mysql.end-time=17:59
database.notarealdb.start-time=18:00
database.notarealdb.end-time=23:59

# Profiles
# Active profile set to 'dev' to enable the DataLoader
spring.profiles.active=dev

# ======================================
# Logging - Additional Logging For Profile
# ======================================
# Specific logging settings for dev profile
logging.level.com.example.userquotaservice.util.DataLoader=DEBUG

# Database connection timing settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
