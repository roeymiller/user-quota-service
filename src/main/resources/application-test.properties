# Database settings for test environment (real database connection)
spring.datasource.url=jdbc:mysql://localhost:3309/user_quota_db
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings - automatic table creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Custom logging settings for test environment
logging.level.com.example=DEBUG
logging.level.com.example.userquotaservice.util.DataLoader=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Data initialization configuration
spring.jpa.defer-datasource-initialization=true 